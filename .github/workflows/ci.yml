name: Validate and publish MerchantOps
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m merchantops.build
      - run: python -m merchantops.benchmark --orders 100000 --repeats 3
      - run: python -m merchantops.publishing
      - uses: actions/upload-artifact@v4
        with:
          name: verified-demo-and-results
          path: |
            dist/
            docs/results.json
            docs/benchmark.json
            docs/source-manifest.json
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified demo
        id: deployment
        uses: actions/deploy-pages@v4
